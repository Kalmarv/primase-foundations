[package]
name = "primase-foundations"
description = "Checked byte readers, game-file hashes, vertex decoding, texture sampling and the compression codecs (LZ4, deflate, zstd, LZO2A, Oodle) game files use"
keywords = ["game-files", "binary-parser", "lz4", "oodle", "vertex"]
categories = ["parser-implementations", "compression", "encoding"]
readme = "README.md"
documentation = "https://docs.rs/primase-foundations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
half.workspace = true
lz4_flex = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
zlib-rs = { workspace = true, optional = true }
ruzstd = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }
oozextract = { workspace = true, optional = true }

[features]
# the `compress` module (lz4, deflate/zlib, zstd, LZO2A, Oodle): readers that do not decompress do not pay for it
compress = ["dep:lz4_flex", "dep:flate2", "dep:zlib-rs", "dep:ruzstd", "dep:libloading", "dep:oozextract"]
# oozextract as a second Oodle decoder (`compress::reference`) on Windows, to compare the game's own library against
# (off Windows it is always there, being the decoder). Meant for dev-dependencies and tests.
reference-decoder = ["compress"]

[dev-dependencies]
primase-testdata.workspace = true
primase-foundations = { workspace = true, features = ["compress", "reference-decoder"] }

[lints]
workspace = true

[workspace]


[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/Kalmarv/primase-foundations"
publish = true

[workspace.dependencies]
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
half = { version = "=2.7.1", default-features = false }
libloading = { version = "=0.9.0", default-features = false, features = ["std"] }
lz4_flex = { version = "=0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
oozextract = { version = "=0.5.7", default-features = false, features = ["verbose_errors"] }
primase-foundations = { path = "." }
primase-testdata = { version = "0.1.4", git = "https://github.com/Kalmarv/primase-testdata", rev = "fff4ebe2f39bbdc8236d99c83b51b506f732a499" }
ruzstd = { version = "=0.7.3", default-features = false, features = ["std", "hash"] }
zlib-rs = { version = "=0.6.8", default-features = false, features = ["std"] }
thiserror = { version = "=2.0.21", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
float_cmp = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
iter_over_hash_type = "deny"
disallowed_methods = "allow"
disallowed_types = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test]
opt-level = 1
